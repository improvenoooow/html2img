# Wariant B: istniejący Apache na VPS (wymaga: sudo a2enmod proxy proxy_http headers).
#   sudo cp apache-rezerwacje.conf /etc/apache2/sites-available/rezerwacje.conf
#   (zmień ServerName), potem:
#   sudo a2ensite rezerwacje && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d rezerwacje.pilankapilatestczew.pl    # HTTPS (Let's Encrypt)
# mod_proxy sam dopisuje nagłówek X-Forwarded-For z prawdziwym IP klienta.
<VirtualHost *:80>
    ServerName rezerwacje.pilankapilatestczew.pl

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 30
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
