# Wariant B: istniejący nginx na VPS.
#   sudo cp nginx-rezerwacje.conf /etc/nginx/sites-available/rezerwacje
#   (zmień server_name), potem:
#   sudo ln -s /etc/nginx/sites-available/rezerwacje /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rezerwacje.pilankapilatestczew.pl     # HTTPS (Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name rezerwacje.pilankapilatestczew.pl;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Aplikacja ufa dokładnie jednemu proxy (TRUST_PROXY=1) i bierze ostatni adres z tej listy,
        # czyli prawdziwe IP klienta – na tym opierają się limity SMS na IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
