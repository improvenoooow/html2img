<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Rezerwacja – podgląd widgetu</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      background: #f3efe9;
      color: #2a2926;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .bar {
      padding: 12px 16px;
      background: #2a2926;
      color: #f3efe9;
      font-size: 14px;
      text-align: center;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 40px 16px 64px; }
    code { background: #e6e0d6; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="bar">Podgląd widgetu rezerwacji – tak będzie wyglądał po osadzeniu na stronie studia.</div>
  <main>
    <!-- Kod do wklejenia na stronę: -->
    <div id="rezerwacja" data-pilanka-booking data-contact-phone="+48 000 000 000"></div>
    <script src="/widget.js" defer></script>
  </main>
</body>
</html>
